<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>더비 DERBY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 상단 바 + 갤러리 탭 / 본문(좌: 명예의 전당·게시판, 우: 사이드 순위·개념글) — 경기장 잔디와 옐로카드에서 색을 가져옴 */
:root{
  --bg:#eef2ec; --surface:#ffffff; --sunk:#e4eae2; --ink:#16211b; --muted:#5a685f; --line:#d3dbd2;
  --pitch:#1d6a44; --pitch-ink:#ffffff; --card:#f0b400; --card-ink:#231b00; --red:#c3372c;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
  --stage:#0b1611; --stage-ink:#eef3ee; --stage-muted:#9db2a5; --gold:#f0b400;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --sunk:#111a15; --ink:#e5ebe6; --muted:#93a299; --line:#28342d;
  --pitch:#3fa36f; --pitch-ink:#07130c; --card:#f2c230; --card-ink:#231b00; --red:#e0665d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --sunk:#111a15; --ink:#e5ebe6; --muted:#93a299; --line:#28342d;
  --pitch:#3fa36f; --pitch-ink:#07130c; --card:#f2c230; --card-ink:#231b00; --red:#e0665d; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--card);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* 상단 */
.top{background:var(--pitch);color:var(--pitch-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:28px;letter-spacing:.02em;line-height:1;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.logo small{font-family:var(--f-body);font-size:12px;font-weight:500;opacity:.8;margin-left:8px;letter-spacing:0}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.who select{background:transparent;border:1px solid currentColor;border-radius:var(--r);padding:4px 8px;color:inherit;max-width:220px}
.who select option{color:#16211b;background:#fff}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--card)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}

main.wrap{padding-block:20px 48px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sechead .sub{color:var(--muted);font-size:13px}
.sechead .right{margin-left:auto}

/* 명예의 전당: 12칸 그리드, 순위가 낮아질수록 칸이 작아짐 */
.hall{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.slot{position:relative;display:block;overflow:hidden;border-radius:var(--r);background:var(--sunk);text-decoration:none;color:#fff;isolation:isolate}
.slot img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.slot .cap{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .cap b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.15}
.slot .cap span.sl{font-size:12.5px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .rk{position:absolute;top:8px;left:8px;background:var(--card);color:var(--card-ink);font-family:var(--f-display);padding:2px 8px;border-radius:4px;font-size:14px}
a.slot:hover img{transform:scale(1.02)}
.slot img{transition:transform .3s}
.t1{grid-column:span 12;aspect-ratio:3/1}
.t1 .cap{padding:18px 22px}.t1 .cap b{font-size:34px}.t1 .cap span.sl{font-size:16px}.t1 .rk{font-size:20px;top:14px;left:14px;padding:3px 12px}
.t2{grid-column:span 6;aspect-ratio:2/1}.t2 .cap b{font-size:22px}
.t3{grid-column:span 4;aspect-ratio:16/10}
.t4{grid-column:span 3;aspect-ratio:4/3}.t4 .cap b{font-size:15px}.t4 .cap span.sl{font-size:11.5px}
@media (max-width:640px){.t1{aspect-ratio:2/1}.t1 .cap b{font-size:24px}.t2{grid-column:span 12}.t3,.t4{grid-column:span 6}}
@media (prefers-reduced-motion:reduce){.slot img{transition:none}}

/* 사이드 */
.side{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:400;padding:0}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.mini th{color:var(--muted);font-weight:500;font-size:11.5px}
.mini td:nth-child(2),.mini th:nth-child(2){text-align:left}
.mini tr:last-child td{border-bottom:0}
.linklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linklist li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;min-width:0}
.linklist li:last-child{border-bottom:0}
.linklist button{border:0;background:none;padding:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.linklist button:hover{text-decoration:underline}
.cmt{color:var(--red);font-weight:700;font-size:12px}

/* 게시판(갤러리 목록) */
.board{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--pitch);border-radius:0 0 var(--r) var(--r);overflow-x:auto}
.board table{width:100%;border-collapse:collapse;min-width:560px}
.board th{font-size:12px;color:var(--muted);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;white-space:nowrap}
.board td.t{text-align:left;white-space:normal}
.board tr:last-child td{border-bottom:0}
.board td.t button{border:0;background:none;padding:0;text-align:left}
.board td.t button:hover{text-decoration:underline}
.board .c-muted{color:var(--muted)}
.head{display:inline-block;font-size:11.5px;color:var(--muted);margin-right:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.pill.open{background:var(--pitch);color:var(--pitch-ink)}
.pill.closed{background:var(--sunk);color:var(--muted)}
.pill.best{background:var(--card);color:var(--card-ink)}
.pill.wait{background:var(--card);color:var(--card-ink)}
.pill.ok{background:var(--pitch);color:var(--pitch-ink)}
.pill.no{background:var(--red);color:#fff}
.boardbar{display:flex;gap:6px;align-items:center;margin-bottom:0;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pager{display:flex;justify-content:center;gap:4px;margin-top:12px;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--surface);min-width:32px;padding:4px 8px;border-radius:4px}
.pager button[aria-current="true"]{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.search{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;font-weight:500}
.btn.pri{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:0}
textarea{width:100%;min-height:180px;resize:vertical}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}

/* 글 보기 */
.post{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--pitch);border-radius:0 0 var(--r) var(--r)}
.post header{padding:16px;border-bottom:1px solid var(--line)}
.post h1{font-size:19px;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.post .body{padding:20px 16px;white-space:pre-wrap;word-break:break-word;max-width:72ch}
.matchinfo{margin:0 16px;padding:10px 12px;background:var(--sunk);border-radius:var(--r);display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.vote{display:flex;justify-content:center;gap:10px;padding:8px 16px 20px}
.vote button{border:2px solid var(--line);background:var(--surface);border-radius:50%;width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:0}
.vote button b{font-family:var(--f-num);font-size:20px}
.vote .up{border-color:var(--pitch);color:var(--pitch)}
.vote .down{border-color:var(--muted);color:var(--muted)}
.comments{border-top:1px solid var(--line);padding:12px 16px}
.comments ul{list-style:none;margin:0 0 12px;padding:0}
.comments li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.comments li .who2{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.comments li .txt{word-break:break-word}
.comments li time{color:var(--muted);font-size:12px}
@media (max-width:560px){.comments li{grid-template-columns:minmax(0,1fr) auto}.comments li .txt{grid-column:1/-1;order:3}}
.cform{display:flex;gap:8px}.cform input{flex:1}

/* 대회 */
.league{display:grid;gap:20px}
.standings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.standings table{width:100%;border-collapse:collapse;min-width:560px}
.standings th,.standings td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
.standings th{color:var(--muted);font-weight:500;font-size:12px}
.standings td.tm,.standings th.tm{text-align:left}
.standings tr.zone td:first-child{box-shadow:inset 3px 0 0 var(--card)}
.standings tr:last-child td{border-bottom:0}
.standings td.pts{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.mlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mlist li{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.mlist li:last-child{border-bottom:0}
.score{font-family:var(--f-num);font-weight:600;background:var(--sunk);padding:1px 8px;border-radius:4px;margin:0 6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.admin{border-color:var(--card);box-shadow:inset 0 3px 0 var(--card)}
.order{list-style:none;margin:10px 0;padding:0;display:grid;gap:4px}
.order li{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--sunk);border-radius:4px}
.order li .n{font-family:var(--f-num);width:28px}
.order li .nm{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 내 팀 공간 */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:800px){.editor{grid-template-columns:minmax(0,1fr)}}
.preview{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}

.notice{background:var(--sunk);border-left:3px solid var(--card);padding:10px 12px;font-size:13px;border-radius:0 var(--r) var(--r) 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:20;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}
.guide{display:grid;gap:10px;max-width:72ch}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* 명예의 전당 그룹 (데스크톱: 1/2/3/4열) */
.hall{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.g{display:grid;gap:10px}
.g1{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hall .slot{grid-column:auto}
.glabel{display:none}

/* 데스크톱에서는 숨기는 모바일 전용 요소 */
.bnav,.fab,.mrows{display:none}

/* ===== 모바일 (폰) ===== */
@media (max-width:640px){
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .top .wrap{padding-block:10px;gap:10px;flex-wrap:nowrap}
  .logo{font-size:24px}.logo small{display:none}
  .who label{display:none}
  .who select{max-width:170px;font-size:12px;padding:4px 6px}
  .tabs{display:none}
  main.wrap{padding-block:14px 24px}
  h2.sec{font-size:20px}
  .sechead{margin-bottom:10px}
  .sechead .sub{font-size:12px;flex-basis:100%;order:3}

  /* 하단 탭바 */
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--muted);position:relative}
  .bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-current="page"]{color:var(--pitch);font-weight:700}
  .bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px}

  /* 글쓰기 플로팅 버튼 */
  .fab{display:flex;align-items:center;gap:6px;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;
    border:0;border-radius:24px;padding:12px 18px;background:var(--pitch);color:var(--pitch-ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .boardbar .btn.pri{display:none}
  .sechead .right{margin-left:0}

  /* 명예의 전당: 1위 크게, 2~3위 세로로, 4~10위는 옆으로 넘기기 */
  .hall{gap:8px}
  .t1{aspect-ratio:16/9}
  .t1 img{object-position:85% 50%}
  .t1 .cap span.sl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .g2{grid-template-columns:minmax(0,1fr);gap:8px}
  .g2 .slot{aspect-ratio:5/2}
  .glabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .g3,.g4{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;gap:8px;scrollbar-width:none}
  .g3::-webkit-scrollbar,.g4::-webkit-scrollbar{display:none}
  .g3 .slot{flex:0 0 74%;scroll-snap-align:start;aspect-ratio:16/10}
  .g4 .slot{flex:0 0 46%;scroll-snap-align:start;aspect-ratio:1/1}
  .g4 .cap b{font-size:14px}

  /* 게시판: 표 대신 2줄 목록 */
  .board table{display:none}
  .mrows{display:block;list-style:none;margin:0;padding:0}
  .mrows li{border-bottom:1px solid var(--line)}
  .mrows li:last-child{border-bottom:0}
  .mrows button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 12px}
  .mrows .tt{font-size:15px;line-height:1.4;word-break:break-word}
  .mrows .mm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--muted)}
  .mrows button:active{background:var(--sunk)}
  .board{border-radius:var(--r);border-top-width:2px}
  .pager button{min-width:36px;padding:6px 8px}
  .search input{flex:1}

  /* 글 보기 */
  .post h1{font-size:18px}
  .post .body{font-size:15px;padding:16px 14px}
  .vote button{width:64px;height:64px}
  .cform{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:8px}

  /* 순위표·경기 기록 */
  .standings table{min-width:0}
  .standings th,.standings td{padding:9px 6px}
  .hm{display:none}
  .mlist li{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .mlist li > :nth-child(2){grid-column:1/-1;order:3}
  .form .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order li{padding:8px}
  .btn.sm{padding:5px 10px}
}
/* v2: 지역 더비·팀 페이지 */
button.slot{border:0;padding:0;width:100%;text-align:left;font:inherit;cursor:pointer}
button.slot:hover img{transform:scale(1.02)}
.preview{display:grid;grid-template-columns:minmax(0,1fr);margin-bottom:6px}
.preview .slot{grid-column:auto}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
#s-preview.stack{gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.rhall{margin-bottom:16px}
.gtabs{margin-bottom:10px;justify-content:space-between}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pitch);border-radius:var(--r);padding:14px}
.rcard:hover{border-color:var(--pitch)}
.rname{font-family:var(--f-display);font-size:19px}
.rmeta{font-size:12px;color:var(--muted)}
.rtop{display:flex;flex-direction:column;gap:2px;font-size:13px}
.rtop b{display:inline-block;width:16px;color:var(--pitch)}

function playMatch(m,teams,R){
  const h=teams.find(t=>t.id===m.homeId), a=teams.find(t=>t.id===m.awayId);
  const g=(x,y)=>Math.max(0,Math.round(1.3+0.45*(x.str-y.str)+(R()-0.5)*2.6));
  m.hs=g(h,a); m.as=g(a,h); m.status="final";
}
function resultPost(s,m,at){

}
function roundPost(s,rid,round,at){
  const T=id=>s.teams.find(t=>t.id===id);
  const ms=s.matches.filter(m=>m.round===round&&s.leagues.find(l=>l.id===m.leagueId).regionId===rid);
  if(!ms.length) return;
  const lines=s.leagues.filter(l=>l.regionId===rid).map(L=>`[${L.name}]\n`+ms.filter(m=>m.leagueId===L.id).map(m=>`  ${T(m.homeId).name} vs ${T(m.awayId).name}`).join("\n")).join("\n\n");
  s.posts.push({id:s.nextPostId++,board:rid,head:"일정",title:`${round}라운드 일정 (${ms[0].date.slice(5).replace("-",".")})`,
    body:lines+"\n\n승부 예상은 댓글로.",author:"기록봇",createdAt:at||Date.now(),views:0,up:0,down:0,voters:[],comments:[],matchId:null});
}

  standings(leagueId,season){
    const rows={}; this.s.teams.filter(t=>t.leagueId===leagueId).forEach(t=>rows[t.id]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});

      const h=rows[m.homeId],a=rows[m.awayId];

      if(m.hs>m.as){h.w++;a.l++;h.pts+=3}else if(m.hs<m.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}
    });
    const list=Object.values(rows); list.forEach(r=>r.ppg=r.p?r.pts/r.p:0);
    return list.sort((x,y)=>y.pts-x.pts||((y.gf-y.ga)-(x.gf-x.ga))||y.gf-x.gf||x.team.name.localeCompare(y.team.name,"ko"));
  },
  /* 리그 1위(우승·승격 후보) 목록. 다른 리그끼리 비교할 때는 경기당 승점 → 득실 → 다득점 */
  leaders(div,season,rid){
    return this.s.leagues.filter(l=>l.div===div&&(!rid||l.regionId===rid)).map(l=>({league:l,row:this.standings(l.id,season)[0]})).filter(x=>x.row&&x.row.p)
      .sort((a,b)=>b.row.ppg-a.row.ppg||((b.row.gf-b.row.ga)-(a.row.gf-a.row.ga))||b.row.gf-a.row.gf);
  },
  /* 전국 무대 배정: K5 정상 1, K6 정상 2, K7 승격(권역 1위) 7. 시·도 최대 regionCap팀.
     K7 1위가 모자라면 K7 2위 중 성적순으로 채움 */
  stageAllocation(season){
    const out=[], per={};
    const take=(list,n,tag)=>{ let k=0; for(const x of list){ if(k>=n) break; const t=x.row.team;
      if((per[t.regionId]||0)>=RULE.regionCap||out.some(o=>o.teamId===t.id)) continue; out.push({teamId:t.id,tag}); per[t.regionId]=(per[t.regionId]||0)+1; k++; } return k; };
    take(this.leaders("K5",season),RULE.stage.K5,"K5 정상");
    take(this.leaders("K6",season),RULE.stage.K6,"K6 정상");
    const got=take(this.leaders("K7",season),RULE.stage.K7,"K7 승격");
    if(got<RULE.stage.K7){
      const second=this.s.leagues.filter(l=>l.div==="K7").map(l=>({row:this.standings(l.id,season)[1]})).filter(x=>x.row&&x.row.p).sort((a,b)=>b.row.ppg-a.row.ppg);
      take(second,RULE.stage.K7-got,"K7 2위");
    }
    return out;
  },
  /* 더비 상단: 그 시·도의 K5 우승 → K6 우승 → K7 권역 우승 중 최고 */
  regionAllocation(season,rid){
    const out=[];
    DIVS.forEach(dv=>{ const l=this.leaders(dv,season,rid)[0]; if(l&&out.length<RULE.regionPrize) out.push({teamId:l.row.team.id,tag:dv+" 우승"}); });
    return out;
  },
  slotsOf(team){
    const h=this.hallSeason(); if(!h) return {};
    const n=h.final.findIndex(x=>x.teamId===team.id), rf=h.regionFinal[team.regionId]||[], r=rf.findIndex(x=>x.teamId===team.id);
    return {national:n>=0?{rank:n+1,tag:h.final[n].tag}:null, region:r>=0?{rank:r+1,tag:rf[r].tag}:null};
  },
  remaining(season){ return this.s.matches.filter(m=>m.season===season&&m.status!=="final").length; },
  nextRound(season){ const m=this.s.matches.filter(x=>x.season===season&&x.status!=="final").sort((a,b)=>a.round-b.round)[0]; return m?m.round:null; },

  /* 협회 결과 불러오기(데모): 다음 라운드 결과를 받아 결과 글 자동 게시 */
  syncResults(season){
    const r=this.nextRound(season); if(!r) return 0;
    const R=rng(Date.now()%100000), ms=this.s.matches.filter(m=>m.season===season&&m.round===r);
    ms.forEach(m=>{ playMatch(m,this.s.teams,R); resultPost(this.s,m); });
    this.save(); return ms.length;
  },
  finalize(season,nextName){
    const s=this.s.seasons.find(x=>x.id===season);
    s.final=this.stageAllocation(season); s.regionFinal={};
    this.openRegions().forEach(r=>{ const a=this.regionAllocation(season,r.id); if(a.length) s.regionFinal[r.id]=a; });
    this.s.leagues.forEach(l=>{ const top=this.standings(l.id,season)[0]; if(top&&top.p) this.s.honors.push({teamId:top.team.id,text:`${season} ${l.name} 우승${l.div!=="K5"?" · "+DIVS[DIVS.indexOf(l.div)-1]+" 승격":""}`}); });
    s.status="ended"; s.endedAt=Date.now();
    this.s.seasons.push({id:nextName,status:"live",endedAt:null,final:null,regionFinal:null});
    this.save();
  },
  addPost(p){ p.id=this.s.nextPostId++; this.s.posts.push(p); this.save(); return p.id; },
  saveTeam(id,patch){ Object.assign(this.team(id),patch,{updatedAt:Date.now()}); return this.save(); }
};

function slotContent(t){
  if(t.hidden) return {sponsor:false,img:"",name:t.name,sub:"신고 누적으로 임시 숨김 · 운영자 확인 중",link:"",hidden:true};

}
function slotHTML(team,rank,label,img,force){

function shrinkImage(file){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const sc=Math.min(1,1200/im.width), c=document.createElement("canvas");
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8)); };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}

  <div class="boardbar" style="margin-bottom:12px"><div class="seg"><button data-admode="team" aria-pressed="${mode==="team"}">우리팀 홍보</button><button data-admode="sponsor" aria-pressed="${mode==="sponsor"}">스폰서 광고</button></div>${st}</div>
  <div class="editor">

        <label>업종<select id="sp-cat" required><option value="">선택</option>${AD_CATS.map(c=>`<option ${c===sp.category?"selected":""}>${esc(c)}</option>`).join("")}</select></label></div>
      <p class="hint" style="margin:-4px 0 0">받을 수 없는 업종: ${AD_BANNED.map(esc).join(", ")}</p>
      <label>광고 이미지<input type="file" id="s-img" accept="image/*"><span class="hint">스폰서가 준 배너. 1200px로 줄여서 저장합니다.</span></label>
      ${img?`<div><button type="button" class="btn sm" data-act="clearimg">이미지 빼기</button></div>`:""}
      <label>광고 문구 (60자)<input type="text" id="sp-slogan" maxlength="60" value="${esc(sp.slogan)}"></label>
      <label>스폰서 링크<input type="url" id="sp-link" placeholder="https://" value="${esc(sp.link)}"><span class="hint">공간을 누르면 이 주소로 갑니다. 없으면 팀 페이지로 갑니다.</span></label>

      <label>배너 이미지<input type="file" id="s-img" accept="image/*"><span class="hint">가로로 긴 사진이 잘 어울립니다. 1200px로 줄여서 저장합니다.</span></label>
      ${img?`<div><button type="button" class="btn sm" data-act="clearimg">이미지 빼고 기본 배너로</button></div>`:""}
      <label>홍보 문구 (60자)<input type="text" id="s-slogan" maxlength="60" value="${esc(t.slogan)}"></label>`}
      <label class="check"><input type="checkbox" id="s-agree" required> 공간 내용의 책임이 우리 팀(과 광고주)에 있고, 금지 업종·불법 내용이 아님을 확인합니다. 신고 ${REPORT_HIDE}건이 쌓이면 자동으로 숨겨집니다.</label>
      <details class="fold sm"><summary>팀 페이지 정보 (소개·연락처·모집)</summary><div class="tfs">
        <label>팀 소개<textarea id="s-intro" maxlength="500" style="min-height:80px">${esc(t.intro)}</textarea></label>
        <div class="row"><label>연락 방법<input type="text" id="s-contact" maxlength="60" value="${esc(t.contact)}" placeholder="오픈채팅, 밴드 이름 등"></label>
          <label>팀 링크<input type="url" id="s-link" placeholder="https://" value="${esc(t.link)}"></label></div>
        <label class="check"><input type="checkbox" id="s-rec" ${t.recruiting?"checked":""}> 팀원 모집 중 표시</label></div></details>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri">저장하고 게시</button><button type="button" class="btn" data-team="${t.id}">팀 페이지 보기</button>
        ${me.role==="admin"?`<button type="button" class="btn warn" data-act="wipeteam">부적절 내용 내리기</button>`:""}</div>
      <p class="hint" style="margin:0">마지막 수정: ${new Date(t.updatedAt).toLocaleString("ko-KR")}</p>
    </form>
    <div id="s-preview" class="stack">${pv.join("")||`<div class="hint">공간을 받으면 이렇게 보입니다</div><div class="preview">${slotHTML(t,2,"예시",img,force)}</div>`}</div>
  </div>`;
}

function guideView(){
  return `<div class="sechead"><h2 class="sec">이용안내</h2></div><div class="panel guide">
    <p style="margin:0">더비는 대한축구협회 생활축구 디비전(K5·K6·K7) 공식 리그를 지역별로 보여 주고, 시즌 성과에 따라 팀에게 사이트 공간을 주는 커뮤니티입니다.</p>
    <ol>
      <li>17개 시·도마다 <b>OO 더비</b>(예: 울산 더비)가 있고, 그 안에 게시판과 그 지역 K5·K6·K7 리그 순위·일정이 함께 있습니다.</li>
      <li>일정과 결과는 <b>협회 공식 기록</b>을 그대로 보여 줍니다. 누구도 고칠 수 없고, 결과가 들어오면 더비 게시판에 결과 글이 자동으로 올라옵니다.</li>
      <li>시즌이 끝나면 <b>전국 무대(사이트 메인)</b> 10칸은 K5 정상 1팀, K6 정상 2팀, K7 승격 7팀이 받습니다. 등급이 다른 리그를 한 줄로 세우지 않습니다.</li>
      <li>각 <b>더비 상단</b> 3칸은 그 시·도의 K5·K6·K7 우승팀이 받습니다.</li>
      <li>공간을 누르면 그 팀 페이지로 갑니다. 팀은 사진·문구·소개·연락처를 직접 꾸미거나, 스폰서에게 광고 자리로 내줄 수 있습니다.</li>
      <li>팀 페이지에서 <b>☆ 관심 팀</b>을 추가하면 홈에서 그 팀의 다음 경기와 지난 결과를 바로 볼 수 있습니다.</li>
    </ol>
    <p class="hint" style="margin:0">시제품이라 위의 <b>데모 계정</b>으로 관리자·팀 주장·일반회원을 바꿔 볼 수 있고, 리그 데이터는 예시입니다.</p></div>`;
}

   4. 동작 연결

/* 다시 그릴 때 입력 중인 값 보존 */
function keepForm(){ return [...document.querySelectorAll("#sform input[id],#sform textarea[id],#sform select[id]")].filter(x=>x.type!=="file").map(x=>[x.id,x.type==="checkbox"?x.checked:x.value]); }
function restoreForm(k){ k.forEach(([id,v])=>{ const x=document.getElementById(id); if(!x) return; if(x.type==="checkbox") x.checked=v; else x.value=v; }); }
function listBack(){ go("gallery",{region:ui.board,gtab:"posts"}); }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-post],[data-gtab],[data-page],[data-act],[data-vote],[data-region],[data-team],[data-league],[data-div],[data-admode],[data-sp],[data-mod],[data-follow]"); if(!el) return;
  const d=el.dataset, me=DB.me();
  if(d.admode){ const keep=keepForm(); ui.adMode=d.admode; ui.draftImg=null; render(); restoreForm(keep); return; }
  if(d.sp){ const t=DB.team(d.tid); if(d.sp==="approve"){ t.sponsor.status="approved"; t.sponsor.note=""; toast(`${t.sponsor.name} 광고를 승인했습니다. ${t.name} 공간에 바로 게시됩니다`); DB.s.modLog.push({at:Date.now(),text:`${t.name} 스폰서 '${t.sponsor.name}' 사전 검수 승인`}); }
    else { t.sponsor.status="rejected"; t.sponsor.note=$("#rej-"+t.id).value; toast(`반려했습니다 (${t.sponsor.note}). 팀 공간에는 팀 홍보가 계속 보입니다`); DB.s.modLog.push({at:Date.now(),text:`${t.name} 스폰서 '${t.sponsor.name}' 반려: ${t.sponsor.note}`}); }
    DB.save(); render(); return; }
  if(d.follow){ const f=DB.s.follows[me.id]=DB.s.follows[me.id]||[]; const k=f.indexOf(d.follow);
    if(k>=0){ f.splice(k,1); toast("관심 팀에서 뺐습니다"); } else { f.push(d.follow); toast("관심 팀에 추가했습니다. 홈에서 다음 경기를 볼 수 있습니다"); }
    DB.save(); render(); return; }
  if(d.mod){ const t=DB.team(d.tid), n=t.reports.length;
    if(d.mod==="dismiss"){ t.reports=[]; t.hidden=false; DB.s.modLog.push({at:Date.now(),text:`${t.name} 신고 ${n}건 기각, 게시 유지`}); toast("신고를 기각했습니다. 공간이 다시 보입니다"); }
    else { Object.assign(t,{image:"",slogan:"",adMode:"team",sponsor:null,reports:[],hidden:false}); DB.s.modLog.push({at:Date.now(),text:`${t.name} 신고 ${n}건 처리, 공간 내용 내림`}); toast("공간 내용을 내렸습니다. 팀 기본 배너로 바뀝니다"); }
    DB.save(); render(); return; }
  if(d.go){ if(d.go==="gallery") go("gallery",{region:DB.s.homeRegion,gtab:"posts",page:1,q:""}); else go(d.go,{page:1,q:"",draftImg:null,adMode:null}); return; }
  if(d.team){ go("team",{teamId:d.team}); return; }
  if(d.region){ go("gallery",{region:d.region,page:1,q:"",gtab:d.gt||(ui.view==="gallery"?ui.gtab:"posts"),leagueId:d.lg||null}); return; }
  if(d.league){ ui.leagueId=d.league; render(); return; }
  if(d.div){ ui.div=d.div; render(); return; }
  if(d.post){ const p=DB.s.posts.find(x=>x.id===+d.post); p.views++; DB.save(); go("post",{postId:p.id,board:p.board}); return; }
  if(d.gtab){ ui.gtab=d.gtab; ui.page=1; render(); return; }
  if(d.page){ ui.page=+d.page; render(); return; }
  if(d.vote){ const p=DB.s.posts.find(x=>x.id===ui.postId); if(p.voters.includes(me.id)) return; p[d.vote]++; p.voters.push(me.id); DB.save(); render(); toast(d.vote==="up"?"추천했습니다":"비추천했습니다"); return; }
  switch(d.act){
    case "write": ui.board=ui.view==="gallery"?ui.region:ui.board; go("write"); break;
    case "backlist": listBack(); break;
    case "clearq": ui.q=""; ui.page=1; render(); break;
    case "delpost": DB.s.posts=DB.s.posts.filter(x=>x.id!==ui.postId); DB.save(); toast("글을 삭제했습니다"); listBack(); break;
    case "apply": toast("시제품이라 실제 신청은 저장되지 않습니다"); break;
    case "sync": { const live=DB.liveSeason(), r=DB.nextRound(live.id), n=DB.syncResults(live.id); toast(`${r}라운드 ${n}경기 결과를 불러왔습니다. 각 더비 게시판에 결과 글이 올라갔습니다`); render(); break; }
    case "askfinal": ui.confirmFinal=true; render(); break;
    case "cancelfinal": ui.confirmFinal=false; render(); break;
    case "finalize": { const live=DB.liveSeason(), nm=($("#next-name").value||"").trim()||String(+live.id+1);
      DB.finalize(live.id,nm); toast(`${live.id} 시즌 확정. 전국 무대와 더비 상단 주인이 바뀌었습니다`); go("home"); break; }
    case "editteam": go("space",{editTeam:ui.teamId,draftImg:null,adMode:null}); break;
    case "clearimg": { const keep=keepForm(); ui.draftImg=""; render(); restoreForm(keep); break; }
    case "wipeteam": { const tid=ui.editTeam||DB.s.teams[0].id; DB.saveTeam(tid,{image:"",slogan:"",link:"",intro:"",adMode:"team",sponsor:null}); ui.adMode=null; ui.draftImg=null; toast("이미지·문구·링크·소개를 비웠습니다"); render(); break; }
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, me=DB.me();
  if(f.id==="rpform"){ const t=DB.team(ui.teamId); t.reports.push({by:me.id,reason:$("#rp-reason").value,at:Date.now()});
    if(t.reports.length>=REPORT_HIDE&&!t.hidden){ t.hidden=true; DB.s.modLog.push({at:Date.now(),text:`${t.name} 신고 ${t.reports.length}건 누적, 자동 숨김`}); toast("신고했습니다. 신고가 누적되어 공간이 임시로 숨겨졌습니다"); }
    else toast("신고했습니다. 운영자가 확인합니다");
    DB.save(); render(); return; }
  if(f.id==="search-form"){ ui.q=$("#q").value.trim(); ui.page=1; render(); }
  if(f.id==="cform"){ const t=$("#ctext").value.trim(); if(!t) return; const p=DB.s.posts.find(x=>x.id===ui.postId); p.comments.push({author:me.name,body:t,at:Date.now()}); DB.save(); render(); }
  if(f.id==="wform"){
    const id=DB.addPost({board:ui.board,head:$("#w-head").value,title:$("#w-title").value.trim(),body:$("#w-body").value,author:me.name,createdAt:Date.now(),views:0,up:0,down:0,voters:[],comments:[],matchId:null});
    toast("글을 올렸습니다"); go("post",{postId:id});
  }
  if(f.id==="sform"){
    const tid=me.role==="admin"?(ui.editTeam||DB.s.teams[0].id):me.teamId, t=DB.team(tid), mode=ui.adMode||t.adMode;
    const chk=id=>{ const raw=$("#"+id).value.trim(); return raw?safeUrl(raw):""; };
    if(($("#s-link").value.trim()&&!chk("s-link"))||(mode==="sponsor"&&$("#sp-link").value.trim()&&!chk("sp-link"))){ toast("링크는 https:// 로 시작해야 합니다"); return; }
    const patch={intro:$("#s-intro").value.trim(),contact:$("#s-contact").value.trim(),link:chk("s-link"),recruiting:$("#s-rec").checked,adMode:mode};
    let msg="저장했습니다. 팀 페이지와 공간에 바로 반영됐습니다";
    if(mode==="sponsor"){
      const old=t.sponsor||{};
      patch.sponsor={name:$("#sp-name").value.trim(),category:$("#sp-cat").value,slogan:$("#sp-slogan").value.trim(),link:chk("sp-link"),
        image:ui.draftImg!==null?ui.draftImg:(old.image||""),status:"",note:"",at:Date.now()};
      const rv=needsReview(patch.sponsor.category)&&me.role!=="admin";
      patch.sponsor.status=rv?"pending":"approved";
      msg=rv?"규제 업종이라 운영자 확인 후 게시됩니다. 그전까지는 팀 홍보가 보입니다":"스폰서 광고를 게시했습니다";
    } else {
      patch.slogan=$("#s-slogan").value.trim(); if(ui.draftImg!==null) patch.image=ui.draftImg;
    }
    if(DB.saveTeam(tid,patch)){ ui.draftImg=null; ui.adMode=null; toast(msg); render(); }
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="home-region"){ DB.s.homeRegion=e.target.value; DB.save(); if(ui.view==="gallery") ui.region=DB.s.homeRegion; render(); toast(`내 지역을 ${DB.region(DB.s.homeRegion).name}(으)로 바꿨습니다`); }
  if(e.target.id==="who-sel"){ DB.s.me=e.target.value; const u=DB.me(); if(u.teamId) DB.s.homeRegion=DB.team(u.teamId).regionId; DB.save(); Object.assign(ui,{editTeam:null,draftImg:null}); render(); toast(`${DB.me().name} 계정으로 바꿨습니다`); }
  if(e.target.id==="edit-team"){ ui.editTeam=e.target.value; ui.draftImg=null; ui.adMode=null; render(); }
  if(e.target.id==="s-img"&&e.target.files[0]){
    const keep=keepForm();
    try{ ui.draftImg=await shrinkImage(e.target.files[0]); render(); restoreForm(keep); toast("미리보기에 넣었습니다. 저장을 눌러야 반영됩니다"); }
    catch(err){ toast("이 이미지는 읽을 수 없습니다. JPG나 PNG로 다시 올려 주세요"); }
  }

});
$("#reset-btn").addEventListener("click",()=>{ DB.reset(); Object.assign(ui,{view:"home",region:DB.s.homeRegion,editTeam:null,draftImg:null}); render(); toast("예시 데이터로 되돌렸습니다"); });

DB.load(); ui.region=DB.s.homeRegion; render();
</script>
