<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETS 축구갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 상단 바 + 갤러리 탭 / 본문(좌: 명예의 전당·게시판, 우: 사이드 순위·개념글) — 경기장 잔디와 옐로카드에서 색을 가져옴 */
:root{
  --bg:#eef2ec; --surface:#ffffff; --sunk:#e4eae2; --ink:#16211b; --muted:#5a685f; --line:#d3dbd2;
  --pitch:#1d6a44; --pitch-ink:#ffffff; --card:#f0b400; --card-ink:#231b00; --red:#c3372c;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --sunk:#111a15; --ink:#e5ebe6; --muted:#93a299; --line:#28342d;
  --pitch:#3fa36f; --pitch-ink:#07130c; --card:#f2c230; --card-ink:#231b00; --red:#e0665d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --sunk:#111a15; --ink:#e5ebe6; --muted:#93a299; --line:#28342d;
  --pitch:#3fa36f; --pitch-ink:#07130c; --card:#f2c230; --card-ink:#231b00; --red:#e0665d; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--card);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* 상단 */
.top{background:var(--pitch);color:var(--pitch-ink)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:28px;letter-spacing:.02em;line-height:1;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.logo small{font-family:var(--f-body);font-size:12px;font-weight:500;opacity:.8;margin-left:8px;letter-spacing:0}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
.who select{background:transparent;border:1px solid currentColor;border-radius:var(--r);padding:4px 8px;color:inherit;max-width:220px}
.who select option{color:#16211b;background:#fff}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--card)}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}

main.wrap{padding-block:20px 48px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sechead .sub{color:var(--muted);font-size:13px}
.sechead .right{margin-left:auto}

/* 명예의 전당: 12칸 그리드, 순위가 낮아질수록 칸이 작아짐 */
.hall{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.slot{position:relative;display:block;overflow:hidden;border-radius:var(--r);background:var(--sunk);text-decoration:none;color:#fff;isolation:isolate}
.slot img{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.slot .cap{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .cap b{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.15}
.slot .cap span.sl{font-size:12.5px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .rk{position:absolute;top:8px;left:8px;background:var(--card);color:var(--card-ink);font-family:var(--f-display);padding:2px 8px;border-radius:4px;font-size:14px}
a.slot:hover img{transform:scale(1.02)}
.slot img{transition:transform .3s}
.t1{grid-column:span 12;aspect-ratio:3/1}
.t1 .cap{padding:18px 22px}.t1 .cap b{font-size:34px}.t1 .cap span.sl{font-size:16px}.t1 .rk{font-size:20px;top:14px;left:14px;padding:3px 12px}
.t2{grid-column:span 6;aspect-ratio:2/1}.t2 .cap b{font-size:22px}
.t3{grid-column:span 4;aspect-ratio:16/10}
.t4{grid-column:span 3;aspect-ratio:4/3}.t4 .cap b{font-size:15px}.t4 .cap span.sl{font-size:11.5px}
@media (max-width:640px){.t1{aspect-ratio:2/1}.t1 .cap b{font-size:24px}.t2{grid-column:span 12}.t3,.t4{grid-column:span 6}}
@media (prefers-reduced-motion:reduce){.slot img{transition:none}}

/* 사이드 */
.side{display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 button{border:0;background:none;color:var(--muted);font-size:12px;font-weight:400;padding:0}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini td,.mini th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
.mini th{color:var(--muted);font-weight:500;font-size:11.5px}
.mini td:nth-child(2),.mini th:nth-child(2){text-align:left}
.mini tr:last-child td{border-bottom:0}
.linklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.linklist li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;min-width:0}
.linklist li:last-child{border-bottom:0}
.linklist button{border:0;background:none;padding:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.linklist button:hover{text-decoration:underline}
.cmt{color:var(--red);font-weight:700;font-size:12px}

/* 게시판(갤러리 목록) */
.board{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--pitch);border-radius:0 0 var(--r) var(--r);overflow-x:auto}
.board table{width:100%;border-collapse:collapse;min-width:560px}
.board th{font-size:12px;color:var(--muted);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;white-space:nowrap}
.board td.t{text-align:left;white-space:normal}
.board tr:last-child td{border-bottom:0}
.board td.t button{border:0;background:none;padding:0;text-align:left}
.board td.t button:hover{text-decoration:underline}
.board .c-muted{color:var(--muted)}
.head{display:inline-block;font-size:11.5px;color:var(--muted);margin-right:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.pill.open{background:var(--pitch);color:var(--pitch-ink)}
.pill.closed{background:var(--sunk);color:var(--muted)}
.pill.best{background:var(--card);color:var(--card-ink)}
.pill.wait{background:var(--card);color:var(--card-ink)}
.pill.ok{background:var(--pitch);color:var(--pitch-ink)}
.pill.no{background:var(--red);color:#fff}
.boardbar{display:flex;gap:6px;align-items:center;margin-bottom:0;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pager{display:flex;justify-content:center;gap:4px;margin-top:12px;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--surface);min-width:32px;padding:4px 8px;border-radius:4px}
.pager button[aria-current="true"]{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.search{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 14px;font-weight:500}
.btn.pri{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;min-width:0}
textarea{width:100%;min-height:180px;resize:vertical}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}

/* 글 보기 */
.post{background:var(--surface);border:1px solid var(--line);border-top:2px solid var(--pitch);border-radius:0 0 var(--r) var(--r)}
.post header{padding:16px;border-bottom:1px solid var(--line)}
.post h1{font-size:19px;margin:0 0 6px;text-wrap:balance}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.post .body{padding:20px 16px;white-space:pre-wrap;word-break:break-word;max-width:72ch}
.matchinfo{margin:0 16px;padding:10px 12px;background:var(--sunk);border-radius:var(--r);display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.vote{display:flex;justify-content:center;gap:10px;padding:8px 16px 20px}
.vote button{border:2px solid var(--line);background:var(--surface);border-radius:50%;width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:0}
.vote button b{font-family:var(--f-num);font-size:20px}
.vote .up{border-color:var(--pitch);color:var(--pitch)}
.vote .down{border-color:var(--muted);color:var(--muted)}
.comments{border-top:1px solid var(--line);padding:12px 16px}
.comments ul{list-style:none;margin:0 0 12px;padding:0}
.comments li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.comments li .who2{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.comments li .txt{word-break:break-word}
.comments li time{color:var(--muted);font-size:12px}
@media (max-width:560px){.comments li{grid-template-columns:minmax(0,1fr) auto}.comments li .txt{grid-column:1/-1;order:3}}
.cform{display:flex;gap:8px}.cform input{flex:1}

/* 대회 */
.league{display:grid;gap:20px}
.standings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.standings table{width:100%;border-collapse:collapse;min-width:560px}
.standings th,.standings td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
.standings th{color:var(--muted);font-weight:500;font-size:12px}
.standings td.tm,.standings th.tm{text-align:left}
.standings tr.zone td:first-child{box-shadow:inset 3px 0 0 var(--card)}
.standings tr:last-child td{border-bottom:0}
.standings td.pts{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
.mlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mlist li{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.mlist li:last-child{border-bottom:0}
.score{font-family:var(--f-num);font-weight:600;background:var(--sunk);padding:1px 8px;border-radius:4px;margin:0 6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.admin{border-color:var(--card);box-shadow:inset 0 3px 0 var(--card)}
.order{list-style:none;margin:10px 0;padding:0;display:grid;gap:4px}
.order li{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--sunk);border-radius:4px}
.order li .n{font-family:var(--f-num);width:28px}
.order li .nm{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* 내 팀 공간 */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:800px){.editor{grid-template-columns:minmax(0,1fr)}}
.preview{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}

.notice{background:var(--sunk);border-left:3px solid var(--card);padding:10px 12px;font-size:13px;border-radius:0 var(--r) var(--r) 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:20;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}
.guide{display:grid;gap:10px;max-width:72ch}
.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* 명예의 전당 그룹 (데스크톱: 1/2/3/4열) */
.hall{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.g{display:grid;gap:10px}
.g1{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hall .slot{grid-column:auto}
.glabel{display:none}

/* 데스크톱에서는 숨기는 모바일 전용 요소 */
.bnav,.fab,.mrows{display:none}

/* ===== 모바일 (폰) ===== */
@media (max-width:640px){
  body{padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .top .wrap{padding-block:10px;gap:10px;flex-wrap:nowrap}
  .logo{font-size:24px}.logo small{display:none}
  .who label{display:none}
  .who select{max-width:170px;font-size:12px;padding:4px 6px}
  .tabs{display:none}
  main.wrap{padding-block:14px 24px}
  h2.sec{font-size:20px}
  .sechead{margin-bottom:10px}
  .sechead .sub{font-size:12px;flex-basis:100%;order:3}

  /* 하단 탭바 */
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;
    background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--muted);position:relative}
  .bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-current="page"]{color:var(--pitch);font-weight:700}
  .bnav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px}

  /* 글쓰기 플로팅 버튼 */
  .fab{display:flex;align-items:center;gap:6px;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;
    border:0;border-radius:24px;padding:12px 18px;background:var(--pitch);color:var(--pitch-ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .fab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
  .boardbar .btn.pri{display:none}
  .sechead .right{margin-left:0}

  /* 명예의 전당: 1위 크게, 2~3위 세로로, 4~10위는 옆으로 넘기기 */
  .hall{gap:8px}
  .t1{aspect-ratio:16/9}
  .t1 img{object-position:85% 50%}
  .t1 .cap span.sl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .g2{grid-template-columns:minmax(0,1fr);gap:8px}
  .g2 .slot{aspect-ratio:5/2}
  .glabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .g3,.g4{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;gap:8px;scrollbar-width:none}
  .g3::-webkit-scrollbar,.g4::-webkit-scrollbar{display:none}
  .g3 .slot{flex:0 0 74%;scroll-snap-align:start;aspect-ratio:16/10}
  .g4 .slot{flex:0 0 46%;scroll-snap-align:start;aspect-ratio:1/1}
  .g4 .cap b{font-size:14px}

  /* 게시판: 표 대신 2줄 목록 */
  .board table{display:none}
  .mrows{display:block;list-style:none;margin:0;padding:0}
  .mrows li{border-bottom:1px solid var(--line)}
  .mrows li:last-child{border-bottom:0}
  .mrows button{display:block;width:100%;border:0;background:none;text-align:left;padding:11px 12px}
  .mrows .tt{font-size:15px;line-height:1.4;word-break:break-word}
  .mrows .mm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:12px;color:var(--muted)}
  .mrows button:active{background:var(--sunk)}
  .board{border-radius:var(--r);border-top-width:2px}
  .pager button{min-width:36px;padding:6px 8px}
  .search input{flex:1}

  /* 글 보기 */
  .post h1{font-size:18px}
  .post .body{font-size:15px;padding:16px 14px}
  .vote button{width:64px;height:64px}
  .cform{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom,0px));background:var(--surface);padding-block:8px}

  /* 순위표·경기 기록 */
  .standings table{min-width:0}
  .standings th,.standings td{padding:9px 6px}
  .hm{display:none}
  .mlist li{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .mlist li > :nth-child(2){grid-column:1/-1;order:3}
  .form .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .order li{padding:8px}
  .btn.sm{padding:5px 10px}
}
/* v2: 지역 갤러리·팀 페이지 */
button.slot{border:0;padding:0;width:100%;text-align:left;font:inherit;cursor:pointer}
button.slot:hover img{transform:scale(1.02)}
.preview{display:grid;grid-template-columns:minmax(0,1fr);margin-bottom:6px}
.preview .slot{grid-column:auto}
.stack{display:flex;flex-direction:column;gap:24px;min-width:0}
#s-preview.stack{gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.rhall{margin-bottom:16px}
.gtabs{margin-bottom:10px;justify-content:space-between}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pitch);border-radius:var(--r);padding:14px}
.rcard:hover{border-color:var(--pitch)}
.rname{font-family:var(--f-display);font-size:19px}
.rmeta{font-size:12px;color:var(--muted)}
.rtop{display:flex;flex-direction:column;gap:2px;font-size:13px}
.rtop b{display:inline-block;width:16px;color:var(--pitch)}
.tlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}

<script>
"use strict";
/* =====================================================================

   load/save와 변경 함수만 Firebase Firestore 호출로 바꾸면 됨.
   ===================================================================== */
const KEY = "ets-demo-v2";
const DAY = 864e5;
const RULE = { minGames:3, samePairCap:2, regionMinTeams:4, regionPrize:3, nationalPrize:10, eloK:30, eloStart:1500 };

const REGIONS = [["ulsan","울산"],["busan","부산"],["gyeongnam","경남"]];
const TEAMS = [
  ["t1","DT","DT","#1d4ed8","ulsan"],["t2","하늘아 덤벼라","하늘","#0e7490","ulsan"],["t4","슛돌이","슛돌","#c2410c","ulsan"],
  ["t5","문수FC","문수","#15803d","ulsan"],["t6","태화강 레인저스","태화","#7c3aed","ulsan"],["t7","삼산 썬데이","삼산","#ca8a04","ulsan"],
  ["t8","미포 FC","미포","#334155","ulsan"],["t9","방어진 조기회","방어","#0f766e","ulsan"],["t10","언양 불고기FC","언양","#9f1239","ulsan"],
  ["t11","진하 비치","진하","#0369a1","ulsan"],
  ["t12","해운대 갈매기","해운","#4d7c0f","busan"],["t13","사직 FC","사직","#be123c","busan"],["t14","광안리 유나이티드","광안","#1e40af","busan"],["t15","서면 토요회","서면","#a16207","busan"],
  ["t3","양산유나이티드","양산","#b91c1c","gyeongnam"],["t16","김해 가야FC","가야","#6d28d9","gyeongnam"],["t17","창원 시티즌스","창원","#0f766e","gyeongnam"],["t18","진주 남강FC","남강","#b45309","gyeongnam"]
];

function seed(){
  const now = Date.now(), H = 36e5;
  const promo = {
    t1:["DT 신입 부원 모집 · 토요일 아침 7시 문수 보조구장","https://example.com/dt",true,"2009년 창단. 토요일 아침마다 문수 보조구장에서 뜁니다.","오픈채팅 'DT 문수'"],
    t2:["하늘이 와도 안 진다 · 연습경기 상대 구해요","",true,"평균 나이 31세, 빠른 축구 지향.","밴드 '하늘아 덤벼라'"],
    t12:["해운대 원정 오실 팀 환영","",true,"부산 동부권 일요 조기회.",""],
    t3:["양산에서 왔습니다. 원정 환영","",false,"",""],
    t4:["슛돌이 20주년","https://example.com/shoot",false,"",""],
    t5:["잔디 상태 1등 구장 문수","",true,"",""],
    t13:["사직에서 공 찹니다","",false,"",""],
    t16:["가야의 후예","",false,"",""]
  };
  const teams = TEAMS.map(([id,name,short,color,regionId])=>{
    const p = promo[id]||["","",false,"",""];
    return {id,name,short,color,regionId,slogan:p[0],link:p[1],recruiting:p[2],intro:p[3],contact:p[4],image:"",updatedAt:now-10*DAY};
  });
  const users = [{id:"u0",name:"ET",role:"admin",teamId:null}];
  teams.forEach((t,i)=>users.push({id:"c"+(i+1),name:t.short+"주장",role:"captain",teamId:t.id}));
  users.push({id:"m1",name:"눈팅러",role:"member",teamId:null});

  const seasons = [
    {id:"s1",name:"2026 가을시즌",status:"ended",endedAt:now-40*DAY,
     final:["t1","t2","t12","t3","t4","t5","t13","t6","t16","t7"],
     regionFinal:{ulsan:["t1","t2","t4"],busan:["t12","t13","t14"],gyeongnam:["t3","t16","t17"]}},
    {id:"s2",name:"2026 겨울시즌",status:"live",endedAt:null,final:null,regionFinal:null}
  ];
  const M = [ // [홈,원정,홈득점,원정득점,며칠전,상태]
    ["t2","t1",2,1,30],["t5","t9",3,3,29],["t4","t6",1,0,28],["t7","t8",0,2,27],["t9","t10",2,2,26],["t11","t7",1,3,25],
    ["t1","t5",4,2,22],["t2","t5",1,1,21],["t6","t8",2,0,20],["t10","t7",0,1,18],["t9","t11",3,1,15],["t1","t2",1,1,12],
    ["t8","t1",0,3,8],["t4","t2",2,3,6],["t7","t6",1,1,5],["t1","t4",2,0,4],["t2","t1",0,2,3],
    ["t12","t13",2,1,24],["t14","t15",1,1,23],["t13","t14",3,0,17],["t15","t12",0,2,14],["t12","t14",1,1,9],["t13","t15",2,2,7],
    ["t3","t16",1,0,24],["t17","t18",2,3,22],["t16","t17",2,2,16],["t18","t3",1,1,13],["t3","t17",3,1,10],["t16","t18",2,0,6],
    ["t12","t1",2,2,11],["t3","t5",1,2,12],["t13","t2",0,1,3],["t16","t12",1,3,2],
    ["t6","t5",0,1,1,"wait"],["t13","t1",1,2,1,"wait"]
  ];
  const places = ["문수 보조구장","태화강 둔치구장","삼산 체육공원","양산 종합운동장","해운대 구장","김해 운동장"];
  const matches = M.map((m,i)=>({id:"g"+(i+1),seasonId:"s2",homeId:m[0],awayId:m[1],hs:m[2],as:m[3],
    date:new Date(now-m[4]*DAY).toISOString().slice(0,10),place:places[i%places.length],status:m[5]||"ok",reportedBy:m[0],photo:i%3===0}));

  const P = (id,board,title,body,author,ago,views,up,down,comments,meta,head)=>({id,board,title,body,author,head:head||"",
    createdAt:now-ago,views,up,down,voters:[],comments:comments.map(([a,t,g])=>({author:a,body:t,at:now-g})),meta:meta||null});
  const posts = [
    P(1,"ulsan","가을시즌 DT 우승 축하합니다","결승 마지막 10분 경기력 미쳤음.\n메인 1위 자리 뭐 올릴지 궁금하네요.","눈팅러",38*DAY,412,31,2,[["하늘주장","인정. 겨울엔 우리가 가져감",38*DAY-H],["DT주장","감사합니다",38*DAY-2*H]]),
    P(2,"ulsan","문수 보조구장 잔디 요즘 왜 이렇게 좋음?","지난주 뛰어봤는데 카펫 같았음","미포주장",14*DAY,233,18,0,[["ET","관리팀이 고생 많이 함",14*DAY-H]]),
    P(3,"ulsan","조기축구 무릎 보호대 추천 좀","40대 진입하니 무릎이 먼저 말함","언양주장",9*DAY,98,3,0,[["삼산주장","그냥 스트레칭이 답",9*DAY-H]],null,"질문"),
    P(4,"ulsan","결과 등록 규칙 정리 (같은 상대 3번째부터 미반영)","1. 대회 탭 → 결과 등록\n2. 상대 팀 주장이 승인하면 반영\n3. 같은 상대와는 시즌 2경기까지만 지역 순위에 반영\n4. 지역 순위는 경기당 승점, 3경기 이상 뛴 팀만 순위권\n5. 전국 순위는 레이팅. 강팀을 이길수록 많이 오름","ET",7*DAY,540,44,1,[["양산주장","정리 감사",7*DAY-H],["태화주장","개념글 ㄱ",7*DAY-3*H]],null,"공지"),
    P(5,"ulsan","겨울시즌 우승 후보 예측","DT가 무난하게 가져갈 듯. 다크호스는 문수FC","해운주장",5*DAY,187,9,6,[["문수주장","다크호스 ㅇㅈ",5*DAY-H],["DT주장","방심 안 합니다",5*DAY-2*H]]),
    P(6,"ulsan","주말 비 예보 있던데 경기 하나요","토요일 오전 강수확률 60%","방어주장",3*DAY,64,0,0,[],null,"질문"),
    P(7,"ulsan","신입인데 갤 분위기 어떤가요","","눈팅러",2*H,22,0,0,[["삼산주장","환영합니다",H]]),
    P(8,"busan","해운대 갈매기 전국 3위 실화냐","부산 자존심","광안주장",30*DAY,301,22,1,[["사직주장","다음엔 사직",30*DAY-H]]),
    P(9,"busan","광안리 쪽 야간 구장 정보 공유","라이트 10시까지","서면주장",6*DAY,77,4,0,[]),
    P(10,"busan","울산 DT랑 2:2 비긴 썰","후반 추가시간 동점골","해운주장",10*DAY,160,12,0,[["DT주장","다음엔 이깁니다",10*DAY-H]]),
    P(11,"gyeongnam","경남 갤 생겼네요","양산·김해·창원·진주 모여라","양산주장",33*DAY,140,11,0,[["가야주장","ㅎㅇ",33*DAY-H]]),
    P(12,"gyeongnam","창원 원정 교통편 질문","주차 가능한가요","남강주장",4*DAY,35,0,0,[],null,"질문"),
    P(13,"match","[울산 남구] 토요일 아침 7시 1팀 구합니다","구장 확보 완료. 심판비 반반.","문수주장",4*DAY,88,2,0,[["태화주장","쪽지 드림",4*DAY-H]],{date:new Date(now+2*DAY).toISOString().slice(0,10),place:"문수 보조구장",level:"중",status:"closed",regionId:"ulsan"}),
    P(14,"match","[양산] 일요일 오후 친선전 상대 모집","원정 오시면 음료 제공. 부산·울산 팀 환영(전국전 등록 가능)","양산주장",2*DAY,61,1,0,[],{date:new Date(now+5*DAY).toISOString().slice(0,10),place:"양산 종합운동장",level:"중",status:"open",regionId:"gyeongnam"}),
    P(15,"match","[울산 동구] 평일 야간 풋살 4:4","라이트 있는 구장","미포주장",20*H,40,0,0,[],{date:new Date(now+3*DAY).toISOString().slice(0,10),place:"방어진 구장",level:"하",status:"open",regionId:"ulsan"}),
    P(16,"match","[부산] 해운대 원정 오실 팀","전국전으로 등록합니다","해운주장",5*H,17,0,0,[],{date:new Date(now+9*DAY).toISOString().slice(0,10),place:"해운대 구장",level:"상",status:"open",regionId:"busan"})
  ];
  const s = {v:2,me:"u0",nextPostId:17,nextMatchId:matches.length+1,regions:REGIONS.map(([id,name])=>({id,name})),teams,users,seasons,matches,posts};
  // 최근 확정 경기 4건은 자동 결과글로 미리 넣어 둠
  matches.filter(m=>m.status==="ok").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).reverse()
    .forEach(m=>autoResultPost(s,m,null,new Date(m.date).getTime()+20*H));
  return s;
}

/* 결과 확정 시 지역 갤러리에 자동 글 */
function autoResultPost(s,m,delta,at){
  const T=id=>s.teams.find(t=>t.id===id); const h=T(m.homeId), a=T(m.awayId);
  const cross = h.regionId!==a.regionId;
  const lines = [`${m.date} · ${m.place}`, `${h.name} ${m.hs} : ${m.as} ${a.name}`];
  if(cross) lines.push("지역 간 경기(전국전) · 전국 레이팅에만 반영");
  if(delta) lines.push(`레이팅 변동: ${h.short} ${fmtD(delta[h.id])} / ${a.short} ${fmtD(delta[a.id])}`);
  lines.push("", "이 글은 경기 결과가 확정되면 자동으로 올라갑니다. 댓글로 후기 남겨 주세요.");
  const boards = cross ? [h.regionId,a.regionId] : [h.regionId];
  boards.forEach(b=>s.posts.push({id:s.nextPostId++,board:b,head:cross?"전국전":"결과",title:`${h.name} ${m.hs}:${m.as} ${a.name}`,
    body:lines.join("\n"),author:"기록봇",createdAt:at||Date.now(),views:0,up:0,down:0,voters:[],comments:[],meta:null,matchId:m.id}));
}
function fmtD(v){ v=Math.round(v||0); return (v>0?"+":"")+v; }

const DB = {
  s:null,
  load(){
    try{ const raw=localStorage.getItem(KEY); if(raw){ const x=JSON.parse(raw); if(x&&x.v===2){ this.s=x; return; } } }catch(e){}
    this.s=seed();
  },
  save(){
    try{ localStorage.setItem(KEY,JSON.stringify(this.s)); return true; }
    catch(e){ toast("브라우저 저장 공간이 가득 찼습니다. 이미지를 더 작은 것으로 바꿔 주세요."); return false; }
  },
  reset(){ this.s=seed(); this.save(); },

  me(){ return this.s.users.find(u=>u.id===this.s.me); },
  team(id){ return this.s.teams.find(t=>t.id===id); },
  region(id){ return this.s.regions.find(r=>r.id===id); },
  user(name){ return this.s.users.find(u=>u.name===name); },
  teamsIn(rid){ return this.s.teams.filter(t=>t.regionId===rid); },
  liveSeason(){ return this.s.seasons.find(x=>x.status==="live"); },
  hallSeason(){ return this.s.seasons.filter(x=>x.status==="ended").sort((a,b)=>b.endedAt-a.endedAt)[0]; },

  /* 지역 리그: 같은 지역 팀끼리 경기만, 같은 상대는 시즌 2경기까지,
     순위는 경기당 승점(최소 3경기) → 득실차 → 다득점 */
  regionMatches(seasonId,rid){
    const ms=this.s.matches.filter(m=>m.seasonId===seasonId&&this.team(m.homeId).regionId===rid&&this.team(m.awayId).regionId===rid)
      .sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id,undefined,{numeric:true}));
    const pair={};
    ms.forEach(m=>{ m._excluded=false; if(m.status!=="ok") return;
      const k=[m.homeId,m.awayId].sort().join("|"); pair[k]=(pair[k]||0)+1; if(pair[k]>RULE.samePairCap) m._excluded=true; });
    return ms;
  },
  regionStandings(seasonId,rid){
    const rows={}; this.teamsIn(rid).forEach(t=>rows[t.id]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
    this.regionMatches(seasonId,rid).filter(m=>m.status==="ok"&&!m._excluded).forEach(m=>{
      const h=rows[m.homeId],a=rows[m.awayId];
      h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;
      if(m.hs>m.as){h.w++;a.l++;h.pts+=3}else if(m.hs<m.as){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}
    });
    const list=Object.values(rows); list.forEach(r=>{r.ppg=r.p?r.pts/r.p:0; r.ok=r.p>=RULE.minGames;});
    return list.sort((x,y)=>(y.ok-x.ok)||(y.ppg-x.ppg)||((y.gf-y.ga)-(x.gf-x.ga))||(y.gf-x.gf)||x.team.name.localeCompare(y.team.name,"ko"));
  },
  regionQualifies(seasonId,rid){ return this.regionStandings(seasonId,rid).filter(r=>r.ok).length>=RULE.regionMinTeams; },

  /* 전국 레이팅(Elo): 모든 확정 경기(지역 간 경기 포함)를 날짜순으로 반영.
     2골 차 이상이면 변동폭을 키움 */
  ratings(){
    const R={}, hist={}, games={}, last={};
    this.s.teams.forEach(t=>{R[t.id]=RULE.eloStart; hist[t.id]=[]; games[t.id]=0; last[t.id]=0;});
    const order=this.s.matches.filter(m=>m.status==="ok").sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id,undefined,{numeric:true}));
    order.forEach(m=>{
      const ra=R[m.homeId], rb=R[m.awayId];
      const ea=1/(1+Math.pow(10,(rb-ra)/400));
      const sa=m.hs>m.as?1:m.hs<m.as?0:.5;
      const gd=Math.abs(m.hs-m.as), g=gd<=1?1:gd===2?1.5:(11+gd)/8;
      const d=RULE.eloK*g*(sa-ea);
      R[m.homeId]+=d; R[m.awayId]-=d; last[m.homeId]=d; last[m.awayId]=-d;
      games[m.homeId]++; games[m.awayId]++;
      hist[m.homeId].push(R[m.homeId]); hist[m.awayId].push(R[m.awayId]);
    });
    return {R,hist,games,last};
  },
  nationalRanking(seasonId){
    const {R,last,hist}=this.ratings();
    const sg={}; this.s.teams.forEach(t=>sg[t.id]=0);
    this.s.matches.filter(m=>m.seasonId===seasonId&&m.status==="ok").forEach(m=>{sg[m.homeId]++;sg[m.awayId]++;});
    return this.s.teams.map(t=>({team:t,r:R[t.id],last:last[t.id],sg:sg[t.id],hist:hist[t.id],ok:sg[t.id]>=RULE.minGames}))
      .sort((a,b)=>(b.ok-a.ok)||(b.r-a.r));
  },

  /* 현재 공간 보유: 전국 메인 순위, 지역 갤러리 순위 */
  slotsOf(team){
    const h=this.hallSeason(); if(!h) return {};
    const n=h.final.indexOf(team.id), r=(h.regionFinal[team.regionId]||[]).indexOf(team.id);
    return {national:n>=0?n+1:null, region:r>=0?r+1:null};
  },

  addPost(p){ p.id=this.s.nextPostId++; this.s.posts.push(p); this.save(); return p.id; },
  reportMatch(m){ m.id="g"+(this.s.nextMatchId++); this.s.matches.push(m); this.save(); },
  confirmMatch(id){
    const m=this.s.matches.find(x=>x.id===id); if(!m) return;
    const before=this.ratings().R; m.status="ok"; const after=this.ratings().R;
    const delta={[m.homeId]:after[m.homeId]-before[m.homeId],[m.awayId]:after[m.awayId]-before[m.awayId]};
    autoResultPost(this.s,m,delta); this.save(); return delta;
  },
  setMatch(id,status){ if(status===null) this.s.matches=this.s.matches.filter(x=>x.id!==id); else { const m=this.s.matches.find(x=>x.id===id); if(m) m.status=status; } this.save(); },

  finalize(seasonId,nationalOrder,nextName){
    const s=this.s.seasons.find(x=>x.id===seasonId);
    s.status="ended"; s.endedAt=Date.now(); s.final=nationalOrder.slice(0,RULE.nationalPrize); s.regionFinal={};
    this.s.regions.forEach(r=>{ if(this.regionQualifies(seasonId,r.id)) s.regionFinal[r.id]=this.regionStandings(seasonId,r.id).filter(x=>x.ok).slice(0,RULE.regionPrize).map(x=>x.team.id); });
    this.s.seasons.push({id:"s"+(this.s.seasons.length+1),name:nextName,status:"live",endedAt:null,final:null,regionFinal:null});
    this.save();
  },
  saveTeam(id,patch){ Object.assign(this.team(id),patch,{updatedAt:Date.now()}); return this.save(); }
};

/* 이미지가 없을 때 쓰는 기본 배너(팀 색 + 약칭) */
function defaultBanner(team,tier){
  const w=1200, h= tier===1?400: tier===2?600: tier===3?750:900;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${team.color}"/><stop offset="1" stop-color="#0b1510"/></linearGradient>
<pattern id="p" width="120" height="${h}" patternUnits="userSpaceOnUse"><rect width="60" height="${h}" fill="#fff" fill-opacity=".05"/></pattern></defs>
<rect width="${w}" height="${h}" fill="url(#g)"/><rect width="${w}" height="${h}" fill="url(#p)"/>
<circle cx="${w*0.78}" cy="${h*0.45}" r="${h*0.32}" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="6"/>
<text x="${w*0.78}" y="${h*0.45}" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="900" font-size="${h*0.2}" fill="#fff" fill-opacity=".85">${esc(team.short)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
/* 공간 하나: 누르면 팀 페이지로 이동 */
function slotHTML(team,rank,label,img){
  const src = img!==undefined ? (img||defaultBanner(team,TIER(rank))) : (team.image||defaultBanner(team,TIER(rank)));
  return `<button class="slot t${TIER(rank)}" data-team="${team.id}" aria-label="${esc(team.name)} 팀 페이지">
    <img src="${esc(src)}" alt=""><span class="rk">${label||rank+"위"}</span>
    <span class="cap"><b>${esc(team.name)}</b>${team.slogan?`<span class="sl">${esc(team.slogan)}</span>`:""}</span></button>`;
}
function hallHTML(ids,label){
  const groups=[[1,1],[2,3],[4,6],[7,10]];
  return `<div class="hall">${groups.map(([a,b],i)=>{
    const g=ids.slice(a-1,b); if(!g.length) return "";
    const lab = i>=2?`<div class="glabel"><span>${a}~${b}위</span><span>옆으로 넘기기 ›</span></div>`:"";
    return lab+`<div class="g g${i+1}">${g.map((id,j)=>slotHTML(DB.team(id),a+j,label?label(a+j):null)).join("")}</div>`;
  }).join("")}</div>`;
}
function sparkline(vals){
  if(vals.length<2) return `<span class="hint">경기 2개 이상부터 그래프가 보입니다</span>`;
  const w=280,h=64,pad=6, mn=Math.min(...vals), mx=Math.max(...vals), span=Math.max(mx-mn,20);
  const x=i=>pad+i*(w-2*pad)/(vals.length-1), y=v=>h-pad-(v-mn)*(h-2*pad)/span;
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lx=x(vals.length-1), ly=y(vals[vals.length-1]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="레이팅 추이 ${Math.round(vals[0])}에서 ${Math.round(vals[vals.length-1])}">
    <line x1="${pad}" x2="${w-pad}" y1="${y(RULE.eloStart)}" y2="${y(RULE.eloStart)}" class="base"/>
    <polygon points="${x(0)},${h-pad} ${pts} ${lx},${h-pad}" class="area"/><polyline points="${pts}" class="ln"/><circle cx="${lx}" cy="${ly}" r="3.5" class="end"/></svg>`;
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{
      const sc=Math.min(1,1200/im.width), c=document.createElement("canvas");
      c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.8));
    }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function nextSeasonName(cur){
  const m=cur.match(/^(\d{4}) (봄|여름|가을|겨울)시즌$/); if(!m) return cur+" 다음 시즌";
  const o=["봄","여름","가을","겨울"], i=o.indexOf(m[2]); return i===3?`${+m[1]+1} 봄시즌`:`${m[1]} ${o[i+1]}시즌`;
}

  if(slots.national) previews.push(`<div class="hint">메인 · 전국 ${slots.national}위 칸</div><div class="preview">${slotHTML({...t,image:img},slots.national,null,img)}</div>`);

  ${me.role==="admin"?`<div class="form" style="margin-bottom:12px"><label>관리자: 수정할 팀<select id="edit-team">${DB.s.regions.map(r=>`<optgroup label="${esc(r.name)}">${DB.teamsIn(r.id).map(x=>`<option value="${x.id}" ${x.id===tid?"selected":""}>${esc(x.name)}</option>`).join("")}</optgroup>`).join("")}</select></label></div>`:""}
  <div class="notice" style="margin-bottom:12px">${previews.length?`<b>${esc(t.name)}</b>은(는) ${esc(hall.name)} 결과로 ${[slots.national?"메인":"",slots.region?"지역 갤러리":""].filter(Boolean).join("과 ")} 공간을 갖고 있습니다. 다음 시즌 확정 때까지 유지됩니다.`
    :`<b>${esc(t.name)}</b>은(는) 지금 보유한 공간이 없습니다. 지역 리그 ${RULE.regionPrize}위 안 또는 전국 레이팅 ${RULE.nationalPrize}위 안에 들면 다음 시즌에 공간을 받습니다. 팀 페이지 정보는 지금도 수정할 수 있습니다.`}</div>
  <div class="editor">
    <form class="panel form" id="sform">
      <label>배너 이미지<input type="file" id="s-img" accept="image/*"><span class="hint">가로로 긴 사진이 잘 어울립니다. 1200px로 줄여서 저장합니다.</span></label>
      ${img?`<div><button type="button" class="btn sm" data-act="clearimg">이미지 빼고 기본 배너로</button></div>`:""}
      <label>홍보 문구 (60자)<input type="text" id="s-slogan" maxlength="60" value="${esc(t.slogan)}"><span class="hint">작은 칸에서는 앞부분만 보입니다</span></label>
      <label>팀 소개<textarea id="s-intro" maxlength="500" style="min-height:90px">${esc(t.intro)}</textarea></label>
      <div class="row"><label>연락 방법<input type="text" id="s-contact" maxlength="60" value="${esc(t.contact)}" placeholder="오픈채팅, 밴드 이름 등"></label>
        <label>외부 링크<input type="url" id="s-link" placeholder="https://" value="${esc(t.link)}"></label></div>
      <label class="check"><input type="checkbox" id="s-rec" ${t.recruiting?"checked":""}> 팀원 모집 중 표시</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri">저장</button><button type="button" class="btn" data-team="${t.id}">팀 페이지 보기</button>
        ${me.role==="admin"?`<button type="button" class="btn warn" data-act="wipeteam">부적절 내용 내리기</button>`:""}</div>
      <p class="hint" style="margin:0">마지막 수정: ${new Date(t.updatedAt).toLocaleString("ko-KR")}</p>
    </form>
    <div id="s-preview" class="stack">${previews.join("")||`<div class="hint">공간을 받으면 여기서 미리보기가 나옵니다</div><div class="preview">${slotHTML({...t,image:img},2,"예시",img)}</div>`}</div>
  </div>`;
}

function guideView(){
  return `<div class="sechead"><h2 class="sec">이용안내</h2></div><div class="panel guide">
    <p style="margin:0">ETS는 아마추어 축구팀이 지역 리그와 지역 간 경기로 겨루고, 성적에 따라 사이트 공간을 나눠 갖는 커뮤니티입니다.</p>
    <ol>
      <li>지역마다 <b>지역 갤러리</b>가 있고, 그 안에 게시판과 지역 리그가 함께 있습니다.</li>
      <li>경기가 끝나면 한 팀 주장이 결과를 등록하고 상대 팀 주장이 승인하면 확정됩니다. 확정되면 갤러리에 결과 글이 자동으로 올라갑니다.</li>
      <li><b>지역 리그</b>는 경기당 승점 순입니다. ${RULE.minGames}경기 이상 뛴 팀만 순위에 들고, 같은 상대와는 시즌 ${RULE.samePairCap}경기까지만 반영됩니다.</li>
      <li><b>전국 순위</b>는 레이팅입니다. 지역 리그 경기와 다른 지역 팀과의 전국전이 모두 반영되고, 강팀을 이길수록 많이 오릅니다.</li>
      <li>시즌이 끝나면 지역 1~${RULE.regionPrize}위는 <b>지역 갤러리 상단</b>, 전국 1~${RULE.nationalPrize}위는 <b>사이트 메인</b> 공간을 받습니다. 지역에 순위권 팀이 ${RULE.regionMinTeams}팀 미만이면 지역 보상은 보류됩니다.</li>
      <li>공간을 누르면 그 팀 페이지로 갑니다. 팀은 사진·문구·소개·연락처를 직접 꾸밉니다.</li>
    </ol>
    <p class="hint" style="margin:0">시제품이라 위의 <b>데모 계정</b>으로 관리자·팀 주장·일반회원을 바꿔 가며 써 볼 수 있습니다.</p></div>`;
}

function render(){
  renderTabs();
  const v={home:homeView,gallery:galleryView,match:matchBoardView,post:postView,write:writeView,league:leagueView,team:teamView,space:spaceView,guide:guideView}[ui.view];
  $("#app").innerHTML=v();
}

/* =====================================================================
   4. 동작 연결
   ===================================================================== */
function listBack(){ if(isGallery(ui.board)) go("gallery",{region:ui.board,gtab:"posts"}); else go("match"); }
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-post],[data-gtab],[data-page],[data-act],[data-vote],[data-match],[data-move],[data-region],[data-mregion],[data-team]"); if(!el) return;
  const d=el.dataset, me=DB.me();
  if(d.go){
    if(d.go==="gallery"){ const r=me.teamId?DB.team(me.teamId).regionId:ui.region; go("gallery",{region:r,gtab:"posts",page:1,q:""}); }
    else go(d.go,{page:1,q:"",draftImg:null}); return;
  }
  if(d.team){ go("team",{teamId:d.team}); return; }
  if(d.region){ go("gallery",{region:d.region,page:1,q:"",gtab:ui.view==="gallery"?ui.gtab:"posts"}); return; }
  if(d.mregion){ ui.matchRegion=d.mregion; ui.page=1; render(); return; }
  if(d.post){ const p=DB.s.posts.find(x=>x.id===+d.post); p.views++; DB.save(); go("post",{postId:p.id,board:p.board}); return; }
  if(d.gtab){ ui.gtab=d.gtab; ui.page=1; render(); return; }
  if(d.page){ ui.page=+d.page; render(); return; }
  if(d.vote){ const p=DB.s.posts.find(x=>x.id===ui.postId); if(p.voters.includes(me.id)) return; p[d.vote]++; p.voters.push(me.id); DB.save(); render(); toast(d.vote==="up"?"추천했습니다":"비추천했습니다"); return; }
  if(d.match){
    if(d.set==="del"){ DB.setMatch(d.match,null); toast("경기 기록을 지웠습니다"); }
    else if(d.set==="ok"){ const m=DB.s.matches.find(x=>x.id===d.match); const dl=DB.confirmMatch(d.match);
      toast(`승인했습니다. ${DB.team(m.homeId).short} ${fmtD(dl[m.homeId])} / ${DB.team(m.awayId).short} ${fmtD(dl[m.awayId])}, 갤러리에 결과 글을 올렸습니다`); }
    else { DB.setMatch(d.match,d.set); toast("거절했습니다. 등록한 팀이 다시 올려야 합니다"); }
    ui.finalOrder=null; render(); return;
  }
  if(d.move){ const i=+d.move,j=i+(+d.dir),o=ui.finalOrder; [o[i],o[j]]=[o[j],o[i]]; render(); return; }
  switch(d.act){
    case "write": ui.board = ui.view==="match"?"match":ui.view==="gallery"?ui.region:ui.board; go("write"); break;
    case "backlist": listBack(); break;
    case "clearq": ui.q=""; ui.page=1; render(); break;
    case "togglematch": { const p=DB.s.posts.find(x=>x.id===ui.postId); p.meta.status=p.meta.status==="open"?"closed":"open"; DB.save(); render(); break; }
    case "delpost": DB.s.posts=DB.s.posts.filter(x=>x.id!==ui.postId); DB.save(); toast("글을 삭제했습니다"); listBack(); break;
    case "askfinal": ui.confirmFinal=true; render(); break;
    case "cancelfinal": ui.confirmFinal=false; render(); break;
    case "finalize": { const live=DB.liveSeason(); const nm=($("#next-name").value||"").trim()||nextSeasonName(live.name);
      DB.finalize(live.id,ui.finalOrder,nm); ui.finalOrder=null; toast(`${live.name} 확정. 메인과 지역 갤러리 공간 주인이 바뀌었습니다`); go("home"); break; }
    case "editteam": go("space",{editTeam:ui.teamId,draftImg:null}); break;
    case "clearimg": ui.draftImg=""; render(); break;
    case "wipeteam": { const tid=ui.editTeam||DB.s.teams[0].id; DB.saveTeam(tid,{image:"",slogan:"",link:"",intro:""}); ui.draftImg=null; toast("이미지·문구·링크·소개를 비웠습니다"); render(); break; }
  }
});

document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, me=DB.me();
  if(f.id==="search-form"){ ui.q=$("#q").value.trim(); ui.page=1; render(); }
  if(f.id==="cform"){ const t=$("#ctext").value.trim(); if(!t) return; const p=DB.s.posts.find(x=>x.id===ui.postId); p.comments.push({author:me.name,body:t,at:Date.now()}); DB.save(); render(); }
  if(f.id==="wform"){
    const isMatch=ui.board==="match";
    const id=DB.addPost({board:ui.board,head:isMatch?"":$("#w-head").value,title:$("#w-title").value.trim(),body:$("#w-body").value,author:me.name,createdAt:Date.now(),views:0,up:0,down:0,voters:[],comments:[],
      meta:isMatch?{regionId:$("#w-region").value,date:$("#w-date").value,place:$("#w-place").value.trim(),level:$("#w-level").value,status:"open"}:null});
    toast("글을 올렸습니다"); go("post",{postId:id});
  }
  if(f.id==="rform"){
    const hs=+$("#r-hs").value, as=+$("#r-as").value, opp=$("#r-opp").value;
    if(!(hs>=0&&as>=0)){ toast("득점은 0 이상 숫자로 입력하세요"); return; }
    DB.reportMatch({seasonId:DB.liveSeason().id,homeId:me.teamId,awayId:opp,hs,as,date:$("#r-date").value,place:$("#r-place").value.trim()||"-",status:"wait",reportedBy:me.teamId,photo:!!$("#r-photo").files.length});
    toast(`등록했습니다. ${DB.team(opp).name} 주장이 승인하면 반영됩니다`); ui.finalOrder=null; render();
  }
  if(f.id==="sform"){
    const tid=me.role==="admin"?(ui.editTeam||DB.s.teams[0].id):me.teamId;
    const raw=$("#s-link").value.trim(), link=raw?safeUrl(raw):"";
    if(raw&&!link){ toast("링크는 https:// 로 시작해야 합니다"); return; }
    const patch={slogan:$("#s-slogan").value.trim(),intro:$("#s-intro").value.trim(),contact:$("#s-contact").value.trim(),link,recruiting:$("#s-rec").checked};
    if(ui.draftImg!==null) patch.image=ui.draftImg;
    if(DB.saveTeam(tid,patch)){ ui.draftImg=null; toast("저장했습니다. 팀 페이지와 공간에 바로 반영됐습니다"); render(); }
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="who-sel"){ DB.s.me=e.target.value; DB.save(); Object.assign(ui,{finalOrder:null,editTeam:null,draftImg:null}); render(); toast(`${DB.me().name} 계정으로 바꿨습니다`); }
  if(e.target.id==="edit-team"){ ui.editTeam=e.target.value; ui.draftImg=null; render(); }
  if(e.target.id==="s-img"&&e.target.files[0]){
    const keep=["s-slogan","s-intro","s-contact","s-link"].map(id=>[id,$("#"+id).value]), rec=$("#s-rec").checked;
    try{ ui.draftImg=await shrinkImage(e.target.files[0]); render(); keep.forEach(([id,v])=>$("#"+id).value=v); $("#s-rec").checked=rec; toast("미리보기에 넣었습니다. 저장을 눌러야 반영됩니다"); }
    catch(err){ toast("이 이미지는 읽을 수 없습니다. JPG나 PNG로 다시 올려 주세요"); }
  }
});
$("#reset-btn").addEventListener("click",()=>{ DB.reset(); Object.assign(ui,{view:"home",finalOrder:null,editTeam:null,draftImg:null}); render(); toast("예시 데이터로 되돌렸습니다"); });

DB.load(); render();
</script>
